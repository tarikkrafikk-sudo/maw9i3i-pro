<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الإدارة — MAW9I3I.PRO</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0a0a0a; color: #f0f0f0; font-family: Tajawal, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { color: #D4AF37; font-size: 22px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 13px; margin: 0 0 24px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .toolbar button {
    background: #1a1a1a; border: 1px solid #333; color: #eee; padding: 9px 16px;
    border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  .toolbar button:hover { border-color: #D4AF37; color: #D4AF37; }
  .stat { background: #141414; border: 1px solid #262626; border-radius: 10px; padding: 10px 16px; font-size: 13px; color: #ccc; }
  .stat b { color: #D4AF37; }
  table { width: 100%; border-collapse: collapse; background: #0f0f0f; border-radius: 10px; overflow: hidden; font-size: 13px; }
  thead th {
    background: #141414; color: #D4AF37; text-align: start; padding: 10px 12px;
    font-weight: 700; border-bottom: 1px solid #262626; white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid #1c1c1c; vertical-align: top; }
  tbody tr:hover { background: #131313; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge.paid { background: rgba(72,199,116,.15); color: #48c774; }
  .badge.pending { background: rgba(255,193,7,.15); color: #ffc107; }
  .badge.failed { background: rgba(255,107,107,.15); color: #ff6b6b; }
  .badge.full { background: rgba(255,255,255,.08); color: #ccc; }
  .badge.deposit { background: rgba(212,175,55,.15); color: #D4AF37; }
  .badge.final { background: rgba(72,152,199,.15); color: #6cc0f5; }
  .muted { color: #777; font-size: 12px; }
  .gen-btn {
    background: linear-gradient(180deg,#e9cf6b,#D4AF37); color: #111; font-weight: 800; border: none;
    border-radius: 7px; padding: 7px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .gen-btn:disabled { opacity: .5; cursor: wait; }
  .link-box {
    margin-top: 6px; background: #1a1a1a; border: 1px solid #333; border-radius: 7px;
    padding: 6px 8px; font-size: 11px; direction: ltr; text-align: left; word-break: break-all; color: #9fd6ff;
  }
  .link-actions { display: flex; gap: 6px; margin-top: 6px; }
  .link-actions a, .link-actions button {
    font-size: 11px; padding: 5px 10px; border-radius: 6px; border: 1px solid #333;
    background: #1a1a1a; color: #eee; text-decoration: none; cursor: pointer; font-family: inherit;
  }
  .link-actions a:hover, .link-actions button:hover { border-color: #D4AF37; color: #D4AF37; }
  .err-msg { color: #ff6b6b; font-size: 12px; margin-top: 6px; }
  .loading, .empty { text-align: center; color: #888; padding: 40px 0; }
  code.oid { color: #999; font-size: 11px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn {
    background: #141414; border: 1px solid #262626; color: #999; padding: 9px 18px;
    border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700;
  }
  .tab-btn.active { border-color: #D4AF37; color: #D4AF37; background: rgba(212,175,55,.08); }
  .badge.pendingrv { background: rgba(255,193,7,.15); color: #ffc107; }
  .badge.approved { background: rgba(72,199,116,.15); color: #48c774; }
  .badge.rejected { background: rgba(255,107,107,.15); color: #ff6b6b; }
  .rv-comment { max-width: 320px; white-space: pre-wrap; }
  .rv-actions { display: flex; gap: 6px; }
  .rv-actions button {
    font-size: 11px; padding: 6px 12px; border-radius: 6px; border: 1px solid #333;
    cursor: pointer; font-family: inherit; font-weight: 700;
  }
  .rv-approve { background: rgba(72,199,116,.12); color: #48c774; border-color: rgba(72,199,116,.4) !important; }
  .rv-reject { background: rgba(255,107,107,.12); color: #ff6b6b; border-color: rgba(255,107,107,.4) !important; }
  .rv-actions button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<div class="wrap">
  <h1>لوحة الإدارة 🔐</h1>
  <p class="sub">تتبع الدفعات + توليد روابط أداء الباقي (70%) + مصادقة آراء الزبناء.</p>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tab-payments-btn">💳 الدفعات</button>
    <button type="button" class="tab-btn" id="tab-reviews-btn">⭐ آراء الزبناء</button>
  </div>

  <div id="panel-payments">
    <div class="toolbar">
      <button id="refresh-btn">🔄 تحديث</button>
      <div class="stat" id="stat-box">كنحسبو...</div>
    </div>
    <div id="content"><div class="loading">⏳ كنجيبو الدفعات...</div></div>
  </div>

  <div id="panel-reviews" style="display:none">
    <div class="toolbar">
      <button id="reviews-refresh-btn">🔄 تحديث</button>
      <div class="stat" id="reviews-stat-box">كنحسبو...</div>
    </div>
    <div id="reviews-content"><div class="loading">⏳ كنجيبو الآراء...</div></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var contentEl = document.getElementById('content');
  var statBox   = document.getElementById('stat-box');
  var refreshBtn = document.getElementById('refresh-btn');

  var STATUS_AR = { paid: 'مخلص', pending: 'فالانتظار', failed: 'فشل' };
  var TYPE_AR = { full: 'كامل', deposit: 'عربون 30%', final: 'تكملة الباقي' };
  // ⭐ الدومين الرسمي ديال الروابط (كيجي من الباكند، ماشي window.location.origin)
  // باش الروابط ديما تبان بـ www.maw9i3i-pro.com حتى إلا admin.html متفتحة
  // مباشرة من onrender.com.
  var SITE_URL = '';

  function fmtDh(n) {
    var v = Math.round(Number(n || 0) * 100) / 100;
    return (Number.isInteger(v) ? v : v.toFixed(2)) + ' DH';
  }

  function fmtDate(s) {
    if (!s) return '—';
    try {
      var d = new Date(s);
      return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return s; }
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function waLink(phone, text) {
    var digits = String(phone || '').replace(/[^0-9]/g, '');
    if (!digits) return null;
    if (digits.charAt(0) === '0') digits = '212' + digits.slice(1);
    else if (digits.slice(0, 3) !== '212') digits = '212' + digits;
    return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(text);
  }

  async function fetchPayments() {
    var res = await fetch('/api/admin/payments', { credentials: 'include' });
    if (res.status === 401) {
      throw new Error('AUTH');
    }
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok || !data.success) {
      throw new Error(data.message || 'تعذر جلب الدفعات.');
    }
    if (data.site_url) SITE_URL = data.site_url;
    return data.payments || [];
  }

  function findFinalRow(payments, orderId) {
    var candidates = payments.filter(function (p) { return p.payment_type === 'final' && p.parent_order_id === orderId; });
    if (!candidates.length) return null;
    candidates.sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    return candidates[0];
  }

  function renderFinalStatus(finalRow) {
    if (!finalRow) return '';
    if (finalRow.status === 'paid') {
      return '<div class="link-box" style="color:#48c774;direction:rtl;text-align:center">✅ الباقي متخلص (' + fmtDh(finalRow.amount_dh) + ')</div>';
    }
    var link = (SITE_URL || window.location.origin) + '/pay-final.html?t=' + finalRow.final_link_token;
    return renderLinkBox(link, finalRow.customer_phone, finalRow.pack_label, finalRow.amount_dh);
  }

  function renderLinkBox(link, phone, packLabel, amount) {
    var waText = 'سلام، هادا رابط أداء الباقي' + (amount ? (' (' + fmtDh(amount) + ')') : '') +
      (packLabel ? (' ديال ' + packLabel) : '') + ':\n' + link;
    var wa = phone ? waLink(phone, waText) : null;
    return '' +
      '<div class="link-box">' + esc(link) + '</div>' +
      '<div class="link-actions">' +
        '<button type="button" class="copy-btn" data-link="' + esc(link) + '">📋 نسخ</button>' +
        (wa ? ('<a href="' + wa + '" target="_blank" rel="noopener">💬 واتساب</a>') : '') +
      '</div>';
  }

  // تفويض (delegation) لبوطونات "نسخ" المزادين ديناميكيا، باش ما نحتاجوش
  // inline onclick (أسهل وأأمن مع روابط فيهم رموز خاصة).
  contentEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.copy-btn');
    if (!btn) return;
    var link = btn.getAttribute('data-link');
    navigator.clipboard.writeText(link).then(function () {
      var original = btn.textContent;
      btn.textContent = '✅ تم النسخ';
      setTimeout(function () { btn.textContent = original; }, 1500);
    }).catch(function () {
      btn.textContent = '⚠️ نسخ يدوي';
    });
  });

  function rowHtml(p, payments) {
    var statusCls = p.status === 'paid' ? 'paid' : (p.status === 'failed' ? 'failed' : 'pending');
    var typeCls = p.payment_type === 'deposit' ? 'deposit' : (p.payment_type === 'final' ? 'final' : 'full');
    var remaining = Number(p.remaining_dh || 0);

    var actionHtml = '';
    if (p.payment_type === 'deposit' && p.status === 'paid' && remaining > 0) {
      var finalRow = findFinalRow(payments, p.order_id);
      if (finalRow) {
        actionHtml = renderFinalStatus(finalRow);
      } else {
        actionHtml =
          '<button type="button" class="gen-btn" data-order="' + esc(p.order_id) + '">🔗 ولّد رابط الباقي (' + fmtDh(remaining) + ')</button>' +
          '<div class="gen-result" data-order-result="' + esc(p.order_id) + '"></div>';
      }
    } else if (p.payment_type === 'deposit' && remaining <= 0) {
      actionHtml = '<span class="muted">—</span>';
    } else if (p.payment_type === 'deposit') {
      actionHtml = '<span class="muted">العربون مازال ماتخلصش</span>';
    } else {
      actionHtml = '<span class="muted">—</span>';
    }

    return '' +
      '<tr>' +
        '<td><code class="oid">' + esc(p.order_id) + '</code>' + (p.parent_order_id ? ('<br><span class="muted">↳ من ' + esc(p.parent_order_id) + '</span>') : '') + '</td>' +
        '<td>' + esc(p.pack_label) + '</td>' +
        '<td>' + esc(p.customer_name || '—') + '<br><span class="muted">' + esc(p.customer_email || '') + '</span><br><span class="muted">' + esc(p.customer_phone || '') + '</span></td>' +
        '<td><span class="badge ' + typeCls + '">' + (TYPE_AR[p.payment_type] || p.payment_type) + '</span></td>' +
        '<td>' + fmtDh(p.amount_dh) + (remaining > 0 ? ('<br><span class="muted">باقي: ' + fmtDh(remaining) + '</span>') : '') + '</td>' +
        '<td><span class="badge ' + statusCls + '">' + (STATUS_AR[p.status] || p.status) + '</span></td>' +
        '<td class="muted">' + fmtDate(p.created_at) + (p.paid_at ? ('<br>خلص: ' + fmtDate(p.paid_at)) : '') + '</td>' +
        '<td>' + actionHtml + '</td>' +
      '</tr>';
  }

  function render(payments) {
    var paidCount = payments.filter(function (p) { return p.status === 'paid'; }).length;
    var pendingDeposits = payments.filter(function (p) {
      return p.payment_type === 'deposit' && p.status === 'paid' && Number(p.remaining_dh || 0) > 0 && !findFinalRow(payments, p.order_id);
    }).length;
    statBox.innerHTML = '<b>' + payments.length + '</b> طلب — <b>' + paidCount + '</b> مخلصين — <b>' + pendingDeposits + '</b> عندهم باقي بلا رابط';

    // كنوريو غير الصفوف الأصلية (full/deposit)، صفوف "final" كنعرضوهم جوا
    // actionHtml ديال العربون الأصلي ديالهم، ماشي بحال صف منفصل.
    var mainRows = payments.filter(function (p) { return p.payment_type !== 'final'; });

    if (!mainRows.length) {
      contentEl.innerHTML = '<div class="empty">ماكاينش أي طلب بعد.</div>';
      return;
    }

    var html = '<table><thead><tr>' +
      '<th>رقم الطلب</th><th>الباك</th><th>الزبون</th><th>النوع</th><th>المبلغ</th><th>الحالة</th><th>التاريخ</th><th>رابط الباقي</th>' +
      '</tr></thead><tbody>' +
      mainRows.map(function (p) { return rowHtml(p, payments); }).join('') +
      '</tbody></table>';

    contentEl.innerHTML = html;

    contentEl.querySelectorAll('.gen-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { onGenerate(btn); });
    });
  }

  async function onGenerate(btn) {
    var orderId = btn.getAttribute('data-order');
    var resultBox = contentEl.querySelector('[data-order-result="' + CSS.escape(orderId) + '"]');
    btn.disabled = true;
    btn.textContent = '⏳ كنولدو...';
    try {
      var res = await fetch('/api/admin/payments/' + encodeURIComponent(orderId) + '/generate-final-link', {
        method: 'POST', credentials: 'include',
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.success) {
        throw new Error(data.message || 'تعذر توليد الرابط.');
      }
      btn.style.display = 'none';
      resultBox.innerHTML = renderLinkBox(data.link, null, data.pack_label, data.amount_dh);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '🔗 إعادة المحاولة';
      resultBox.innerHTML = '<div class="err-msg">⚠️ ' + esc(err.message) + '</div>';
    }
  }

  async function load() {
    contentEl.innerHTML = '<div class="loading">⏳ كنجيبو الدفعات...</div>';
    try {
      var payments = await fetchPayments();
      render(payments);
    } catch (err) {
      if (err.message === 'AUTH') {
        contentEl.innerHTML = '<div class="empty">🔒 خاصك تسجل الدخول (Basic Auth). عاود تحميل الصفحة.</div>';
      } else {
        contentEl.innerHTML = '<div class="empty">⚠️ ' + esc(err.message) + '</div>';
      }
    }
  }

  refreshBtn.addEventListener('click', load);
  load();

  // =====================================================================
  // تبويب "آراء الزبناء" - مصادقة/رفض الآراء لي كتوصل من reviews.js
  // =====================================================================
  var tabPaymentsBtn = document.getElementById('tab-payments-btn');
  var tabReviewsBtn  = document.getElementById('tab-reviews-btn');
  var panelPayments  = document.getElementById('panel-payments');
  var panelReviews   = document.getElementById('panel-reviews');
  var reviewsContent = document.getElementById('reviews-content');
  var reviewsStatBox = document.getElementById('reviews-stat-box');
  var reviewsRefreshBtn = document.getElementById('reviews-refresh-btn');

  var REVIEW_STATUS_AR = { pending: 'فالانتظار', approved: 'مصادق عليه', rejected: 'مرفوض' };
  var reviewsLoadedOnce = false;

  tabPaymentsBtn.addEventListener('click', function () {
    tabPaymentsBtn.classList.add('active');
    tabReviewsBtn.classList.remove('active');
    panelPayments.style.display = '';
    panelReviews.style.display = 'none';
  });
  tabReviewsBtn.addEventListener('click', function () {
    tabReviewsBtn.classList.add('active');
    tabPaymentsBtn.classList.remove('active');
    panelReviews.style.display = '';
    panelPayments.style.display = 'none';
    if (!reviewsLoadedOnce) { reviewsLoadedOnce = true; loadReviews(); }
  });

  async function fetchReviews() {
    var res = await fetch('/api/admin/reviews', { credentials: 'include' });
    if (res.status === 401) throw new Error('AUTH');
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok || !data.success) throw new Error(data.message || 'تعذر جلب الآراء.');
    return data.reviews || [];
  }

  function reviewRowHtml(r) {
    var statusCls = r.status === 'approved' ? 'approved' : (r.status === 'rejected' ? 'rejected' : 'pendingrv');
    var stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
    var actions = '';
    if (r.status !== 'approved') {
      actions += '<button type="button" class="rv-approve" data-id="' + r.id + '" data-action="approve">✅ مصادقة</button>';
    }
    if (r.status !== 'rejected') {
      actions += '<button type="button" class="rv-reject" data-id="' + r.id + '" data-action="reject">🚫 رفض</button>';
    }
    return '' +
      '<tr>' +
        '<td>' + esc(r.name) + '</td>' +
        '<td class="rv-comment">' + esc(r.comment) + '</td>' +
        '<td>' + stars + '</td>' +
        '<td>' + esc(r.pack_slug || '—') + '</td>' +
        '<td><span class="badge ' + statusCls + '">' + (REVIEW_STATUS_AR[r.status] || r.status) + '</span></td>' +
        '<td class="muted">' + fmtDate(r.created_at) + '</td>' +
        '<td><div class="rv-actions" data-row-actions="' + r.id + '">' + actions + '</div></td>' +
      '</tr>';
  }

  function renderReviews(reviews) {
    var pending = reviews.filter(function (r) { return r.status === 'pending'; }).length;
    reviewsStatBox.innerHTML = '<b>' + reviews.length + '</b> رأي — <b>' + pending + '</b> فالانتظار';

    if (!reviews.length) {
      reviewsContent.innerHTML = '<div class="empty">ماكاينش أي رأي بعد.</div>';
      return;
    }

    var html = '<table><thead><tr>' +
      '<th>الاسم</th><th>التعليق</th><th>التقييم</th><th>الباك</th><th>الحالة</th><th>التاريخ</th><th>إجراء</th>' +
      '</tr></thead><tbody>' +
      reviews.map(reviewRowHtml).join('') +
      '</tbody></table>';

    reviewsContent.innerHTML = html;

    reviewsContent.querySelectorAll('.rv-approve, .rv-reject').forEach(function (btn) {
      btn.addEventListener('click', function () { onModerate(btn); });
    });
  }

  async function onModerate(btn) {
    var id = btn.getAttribute('data-id');
    var action = btn.getAttribute('data-action'); // approve | reject
    var rowActions = reviewsContent.querySelector('[data-row-actions="' + id + '"]');
    rowActions.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
    try {
      var res = await fetch('/api/admin/reviews/' + encodeURIComponent(id) + '/' + action, {
        method: 'POST', credentials: 'include',
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.success) throw new Error(data.message || 'فشلت العملية.');
      loadReviews(); // نعاودو نجيبو اللائحة كاملة باش الحالة الجديدة تبان
    } catch (err) {
      rowActions.innerHTML = '<span class="err-msg">⚠️ ' + esc(err.message) + '</span>';
    }
  }

  async function loadReviews() {
    reviewsContent.innerHTML = '<div class="loading">⏳ كنجيبو الآراء...</div>';
    try {
      var reviews = await fetchReviews();
      renderReviews(reviews);
    } catch (err) {
      if (err.message === 'AUTH') {
        reviewsContent.innerHTML = '<div class="empty">🔒 خاصك تسجل الدخول (Basic Auth). عاود تحميل الصفحة.</div>';
      } else {
        reviewsContent.innerHTML = '<div class="empty">⚠️ ' + esc(err.message) + '</div>';
      }
    }
  }

  reviewsRefreshBtn.addEventListener('click', loadReviews);
})();
</script>
</body>
</html>
